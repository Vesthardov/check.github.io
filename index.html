<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jerry's Game - Мобильная и ПК версия</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #74b9ff, #a29bfe);
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            height: 100vh;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 10;
            background: rgba(255, 255, 255, 0.85);
            padding: 10px 25px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            width: 85%;
            max-width: 400px;
        }
        #device-info {
            font-size: 11px;
            color: #7f8c8d;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0 0 5px 0;
        }
        #score {
            font-size: 26px;
            font-weight: bold;
            color: #2d3436;
            margin: 0;
        }
        #comment {
            font-size: 14px;
            color: #6c5ce7;
            margin-top: 5px;
            font-style: italic;
            min-height: 20px;
        }
        .balloon {
            position: absolute;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            bottom: -120px;
            animation: fly linear forwards;
            /* Отключаем стандартные синие вспышки при тапе на смартфонах */
            -webkit-tap-highlight-color: transparent; 
        }
        .balloon::after {
            content: "";
            position: absolute;
            bottom: -6px;
            left: calc(50% - 4px);
            border-left: 4px solid transparent;
            border-right: 4px solid transparent;
            border-bottom: 8px solid rgba(0,0,0,0.15);
        }
        @keyframes fly {
            0% {
                bottom: -120px;
                transform: translateX(0);
            }
            50% {
                transform: translateX(15px);
            }
            100% {
                bottom: 105vh;
                transform: translateX(-15px);
            }
        }
    </style>
</head>
<body>

    <div id="ui">
        <div id="device-info">Определение устройства...</div>
        <p id="score">Шары: 0</p>
        <div id="comment">Загрузка...</div>
    </div>

    <script>
        let score = 0;
        const scoreDisplay = document.getElementById('score');
        const commentDisplay = document.getElementById('comment');
        const deviceInfo = document.getElementById('device-info');
        
        // 1. ОПРЕДЕЛЕНИЕ УСТРОЙСТВА
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        
        // Настройки в зависимости от платформы
        const config = {
            balloonWidth: isMobile ? 70 : 60,  // На смартфонах шарики чуть крупнее, чтобы легче попадать пальцем
            balloonHeight: isMobile ? 88 : 75,
            spawnSpeed: isMobile ? 700 : 850,  // На смартфонах шарики летят чуть чаще
            inputEvent: isMobile ? 'touchstart' : 'mousedown' // Мобильный тач или клик мыши
        };

        // Выводим статус пользователю
        deviceInfo.textContent = isMobile ? "Режим: Смартфон (Тач)" : "Режим: Компьютер (Мышь)";
        commentDisplay.textContent = isMobile ? "Тапай по шарам!" : "Кликай по шарам!";

        const colors = ['#ff7675', '#74b9ff', '#55efc4', '#ffeaa7', '#a29bfe', '#fd79a8'];
        const jerryQuotes = [
            "Отличный клик!",
            "Ты просто мастер!",
            "Невероятный талант!",
            "Уровень Джерри: Бог",
            "Какое сложное испытание!",
            "Продолжай, ты меняешь мир!",
            "Вау! Еще один!"
        ];

        function playPopSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(420, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(90, ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.08);
            } catch(e) { console.log("Звук заблокирован до первого тапа"); }
        }

        function createBalloon() {
            const balloon = document.createElement('div');
            balloon.classList.add('balloon');
            
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            const randomX = Math.random() * (window.innerWidth - config.balloonWidth);
            const randomDuration = Math.random() * 3 + 3; // 3-6 секунд
            
            // Динамические размеры из конфига устройства
            balloon.style.width = `${config.balloonWidth}px`;
            balloon.style.height = `${config.balloonHeight}px`;
            balloon.style.backgroundColor = randomColor;
            balloon.style.left = `${randomX}px`;
            balloon.style.animationDuration = `${randomDuration}s`;
            balloon.style.boxShadow = `inset -7px -7px 0px rgba(0,0,0,0.1), 0 5px 10px rgba(0,0,0,0.15)`;
            
            // Обработка лопания по правильному событию (touchstart или mousedown)
            balloon.addEventListener(config.inputEvent, (e) => {
                // Предотвращаем ложные двойные срабатывания на мобильных
                e.preventDefault(); 
                
                playPopSound();
                balloon.remove();
                score++;
                scoreDisplay.textContent = `Шары: ${score}`;
                
                if (score % 3 === 0) {
                    const randomQuote = jerryQuotes[Math.floor(Math.random() * jerryQuotes.length)];
                    commentDisplay.textContent = randomQuote;
                }
            });
            
            balloon.addEventListener('animationend', () => {
                balloon.remove();
            });
            
            document.body.appendChild(balloon);
        }

        // Запуск спавна с адаптивной скоростью
        setInterval(createBalloon, config.spawnSpeed);
    </script>
</body>
</html>
