<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPN & Proxy Advanced Checker</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-color: #c9d1d9;
            --accent-color: #58a6ff;
            --success-color: #238636;
            --warning-color: #d29922;
            --danger-color: #f85149;
            --border-color: #30363d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: #ffffff;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #8b949e;
            font-size: 14px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            color: #ffffff;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 15px;
        }

        .info-block {
            display: flex;
            flex-direction: column;
        }

        .label {
            font-size: 12px;
            color: #8b949e;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .value {
            font-size: 16px;
            font-weight: 500;
            word-break: break-all;
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 2em;
            color: #fff;
        }

        .badge-success { background-color: var(--success-color); }
        .badge-warning { background-color: var(--warning-color); }
        .badge-danger { background-color: var(--danger-color); }
        .badge-info { background-color: var(--accent-color); }

        .btn {
            background-color: #21262d;
            border: 1px solid var(--border-color);
            color: var(--accent-color);
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
        }

        .btn:hover { background-color: #30363d; border-color: #8b949e; }
        .loader { color: var(--accent-color); font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>VPN / Proxy Analyzer</h1>
        <div class="subtitle">Локальный анализ безопасности соединения</div>
    </header>

    <div class="card">
        <div class="card-title">Сетевые маркеры</div>
        <div class="grid">
            <div class="info-block">
                <span class="label">Задержка (Пинг до GitHub)</span>
                <span class="value" id="ping-val"><span class="loader">Замер...</span></span>
            </div>
            <div class="info-block">
                <span class="label">Локальная Таймзона</span>
                <span class="value" id="tz-val">-</span>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-title">Анализ утечек WebRTC</div>
        <div class="grid">
            <div class="info-block">
                <span class="label">Статус WebRTC</span>
                <span class="value" id="webrtc-status"><span class="loader">Тестируем...</span></span>
            </div>
            <div class="info-block">
                <span class="label">Обнаруженные IP</span>
                <span class="value" id="detected-ips">-</span>
            </div>
            <div class="info-block">
                <span class="label">Предполагаемый режим</span>
                <span class="value" id="tunnel-mode-val">-</span>
            </div>
        </div>
    </div>

    <button class="btn" onclick="runAnalysis()">Перезапустить тест</button>
</div>

<script>
    // Проверка WebRTC без зависимости от внешних серверов (используем только STUN)
    function checkWebRTC() {
        return new Promise((resolve) => {
            try {
                const rtc = new RTCPeerConnection({iceServers: [{urls: 'stun:://google.com'}]});
                rtc.createDataChannel('');
                rtc.createOffer().then(offer => rtc.setLocalDescription(offer)).catch(() => resolve([]));
                
                let detectedIPs = [];
                rtc.onicecandidate = (ice) => {
                    if (!ice || !ice.candidate || !ice.candidate.candidate) {
                        resolve(detectedIPs);
                        return;
                    }
                    const parts = ice.candidate.candidate.split(' ');
                    const ip = parts[4];
                    if (ip && !detectedIPs.includes(ip) && ip.length > 5) {
                        detectedIPs.push(ip);
                    }
                };
                setTimeout(() => resolve(detectedIPs), 1200);
            } catch(e) {
                resolve([]);
            }
        });
    }

    // Измерение пинга методом загрузки локальной картинки самого гитхаба
    function measurePing() {
        return new Promise((resolve) => {
            const start = performance.now();
            const img = new Image();
            img.src = "https://github.com" + start;
            img.onload = () => resolve(Math.round(performance.now() - start));
            img.onerror = () => {
                // Если картинка не грузится, пробуем встроенный fetch без проверки CORS
                fetch('https://github.com', { mode: 'no-cors', cache: 'no-store' })
                    .then(() => resolve(Math.round(performance.now() - start)))
                    .catch(() => resolve('Ошибка сети'));
            };
        });
    }

    async function runAnalysis() {
        document.getElementById('ping-val').innerHTML = '<span class="loader">Замер...</span>';
        document.getElementById('webrtc-status').innerHTML = '<span class="loader">Тестируем...</span>';
        document.getElementById('detected-ips').innerText = '-';
        document.getElementById('tunnel-mode-val').innerText = '-';

        // 1. Выводим таймзону устройства
        document.getElementById('tz-val').innerText = Intl.DateTimeFormat().resolvedOptions().timeZone;

        // 2. Считаем пинг
        const ping = await measurePing();
        document.getElementById('ping-val').innerText = typeof ping === 'number' ? `${ping} мс` : ping;

        // 3. Запускаем тест WebRTC
        const ips = await checkWebRTC();
        
        if (ips.length === 0) {
            document.getElementById('webrtc-status').innerHTML = '<span class="badge badge-info">Блокировка / Скрыт</span>';
            document.getElementById('detected-ips').innerText = 'Локальные IP не утекли';
            document.getElementById('tunnel-mode-val').innerHTML = '<span class="badge badge-success">Безопасное подключение</span>';
        } else {
            document.getElementById('webrtc-status').innerHTML = '<span class="badge badge-warning">Доступен</span>';
            document.getElementById('detected-ips').innerText = ips.join(', ');

            // Если среди выданных WebRTC адресов есть публичные (не начинаются на локальные подсети)
            const hasExternal = ips.some(ip => !ip.startsWith('192.168.') && !ip.startsWith('10.') && !ip.startsWith('172.') && !ip.startsWith('127.') && !ip.includes('local'));
            
            if (hasExternal) {
                document.getElementById('tunnel-mode-val').innerHTML = '<span class="badge badge-danger">Обычный Proxy / Сбой туннеля</span><br><small>Виден реальный IP через WebRTC</small>';
            } else {
                document.getElementById('tunnel-mode-val').innerHTML = '<span class="badge badge-success">Полный TUN Режим</span><br><small>Трафик инкапсулирован (Xray TUN/Sing-Box)</small>';
            }
        }
    }

    window.onload = runAnalysis;
</script>
</body>
</html>
